<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValoraBot - Gestión de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #0f172a; color: #f8fafc; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="url"], input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #334155; color: #fff; }
        button { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #059669; }
        .error-msg { color: #ef4444; margin-top: 10px; }
        .success-msg { color: #10b981; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #475569; padding: 8px; text-align: left; }
        th { background-color: #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Monitoreo de Productos y Alertas</h2>
        
        <div class="card">
            <h3>Agregar Nuevo Producto</h3>
            <form id="productForm">
                <div class="form-group">
                    <label for="productUrl">URL del Producto:</label>
                    <input type="url" id="productUrl" placeholder="https://ejemplo.com/producto" required>
                </div>
                <div class="form-group">
                    <label for="targetPrice">Precio Objetivo ($):</label>
                    <input type="number" id="targetPrice" step="0.01" min="0.01" placeholder="99.99" required>
                </div>
                <button type="submit">Guardar Producto</button>
            </form>
            <div id="feedbackMessage"></div>
        </div>

        <div class="card">
            <h3>Mis Productos Monitoreados</h3>
            <table>
                <thead>
                    <tr>
                        <th>URL</th>
                        <th>Precio Actual</th>
                        <th>Precio Objetivo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr><td colspan="4">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="products.js"></script>
</body>
</html>
